<link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Minhas%20Finan%C3%A7as%22,%22short_name%22:%22Finan%C3%A7as%22,%22display%22:%22standalone%22,%22start_url%22:%22.%22,%22background_color%22:%22%23F6F4EE%22,%22theme_color%22:%22%231F6F54%22}">
<meta name="theme-color" content="#1F6F54">

<script type="module">
  // ============================================================
  // FIREBASE — login com Google + banco de dados (Firestore)
  // Para ativar a sincronização entre aparelhos, crie um projeto
  // gratuito em https://console.firebase.google.com e cole aqui
  // embaixo a configuração do seu app da web (Project settings →
  // General → Your apps → SDK setup and configuration).
  // Enquanto FIREBASE_CONFIG estiver com os valores de exemplo,
  // o app funciona normalmente, só que 100% local (sem sync).
  // ============================================================
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyC-jjRs7Jlxbhv9WpVNYffXjZ3pqy1zxMQ",
    authDomain: "polipoli-ada5c.firebaseapp.com",
    projectId: "polipoli-ada5c",
    storageBucket: "polipoli-ada5c.firebasestorage.app",
    messagingSenderId: "72423424560",
    appId: "1:72423424560:web:9d8679d32a61c631ec23f5"
  };

  const isConfigured = FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf('COLE_AQUI') === -1;

  window.FinancasCloud = {
    configured: false,
    clientId: Math.random().toString(36).slice(2) + Date.now().toString(36),
    getUser: () => null,
    signIn: () => { alert('Configure o FIREBASE_CONFIG no início do arquivo HTML para usar o login com Google.'); },
    signOutUser: () => {},
    loadDoc: async () => null,
    saveDoc: async () => {},
    subscribe: () => () => {},
  };

  if (isConfigured) {
    try {
      const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js");
      const {
        getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult,
        onAuthStateChanged, signOut
      } = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js");
      const {
        getFirestore, doc, getDoc, setDoc, onSnapshot, serverTimestamp
      } = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js");

      const app = initializeApp(FIREBASE_CONFIG);
      const auth = getAuth(app);
      const db = getFirestore(app);
      const CLIENT_ID = window.FinancasCloud.clientId;
      let currentUser = null;

      getRedirectResult(auth).catch((e) => console.warn('[Financas] redirect result:', e && e.message));

      onAuthStateChanged(auth, (user) => {
        currentUser = user;
        window.dispatchEvent(new CustomEvent('financas-auth-changed', { detail: { user } }));
      });

      window.FinancasCloud = {
        configured: true,
        clientId: CLIENT_ID,
        getUser: () => currentUser,
        signIn: () => {
          const provider = new GoogleAuthProvider();
          signInWithRedirect(auth, provider);
        },
        signOutUser: () => signOut(auth),
        loadDoc: async (uid) => {
          const ref = doc(db, 'financas', uid);
          const snap = await getDoc(ref);
          return snap.exists() ? snap.data() : null;
        },
        saveDoc: async (uid, dataObj) => {
          const ref = doc(db, 'financas', uid);
          await setDoc(ref, {
            data: JSON.stringify(dataObj),
            updatedAt: serverTimestamp(),
            updatedBy: CLIENT_ID,
          });
        },
        subscribe: (uid, callback) => {
          const ref = doc(db, 'financas', uid);
          return onSnapshot(ref, (snap) => {
            if (!snap.exists()) return;
            const d = snap.data();
            if (d.updatedBy === CLIENT_ID) return;
            callback(d);
          }, (err) => console.warn('[Financas] snapshot error:', err && err.message));
        },
      };
    } catch (e) {
      console.error('[Financas] Falha ao iniciar Firebase:', e);
    }
  }

  // Avisa o app React (que carrega depois) que já sabemos o estado inicial (deslogado, se não configurado)
  window.dispatchEvent(new CustomEvent('financas-auth-changed', { detail: { user: window.FinancasCloud.getUser() } }));
</script>

function MiniAreaChart({ data, xKey, yKey, color = '#1F6F54', height = 150 }) {
  if (!data || data.length < 2) return <div className="chart-empty">Dados insuficientes para o gráfico ainda.</div>;
  const w = 320;
  const pad = { top: 10, right: 6, bottom: 20, left: 6 };
  const values = data.map((d) => Number(d[yKey]) || 0);
  const min = Math.min(...values, 0);
  const max = Math.max(...values, 1);
  const range = (max - min) || 1;
  const stepX = (w - pad.left - pad.right) / (data.length - 1);
  const pts = data.map((d, i) => ({
    x: pad.left + i * stepX,
    y: pad.top + (1 - (Number(d[yKey]) - min) / range) * (height - pad.top - pad.bottom),
    label: d[xKey], value: Number(d[yKey]) || 0,
  }));
  const line = pts.map((p, i) => (i === 0 ? `M${p.x},${p.y}` : `L${p.x},${p.y}`)).join(' ');
  const area = `${line} L${pts[pts.length - 1].x},${height - pad.bottom} L${pts[0].x},${height - pad.bottom} Z`;
  const gid = 'g' + Math.random().toString(36).slice(2, 9);
  return (
    <div>
      <svg viewBox={`0 0 ${w} ${height}`} width="100%" height={height} preserveAspectRatio="none">
        <defs>
          <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={color} stopOpacity="0.35" />
            <stop offset="100%" stopColor={color} stopOpacity="0" />
          </linearGradient>
        </defs>
        <path d={area} fill={`url(#${gid})`} stroke="none" />
        <path d={line} fill="none" stroke={color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" />
        {pts.map((p, i) => <circle key={i} cx={p.x} cy={p.y} r="2.6" fill={color}><title>{`${p.label}: ${brl(p.value)}`}</title></circle>)}
      </svg>
      <div className="chart-labels">{data.map((d, i) => <span key={i}>{d[xKey]}</span>)}</div>
    </div>
  );
}

const MONTH_SHORT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

const DEFAULT_CATEGORIAS = ['Alimentação','Transporte','Casa','Saúde','Lazer','Educação','Assinaturas','Dívidas','Compras','Viagens','Salário','Investimentos','Outros'];

const brl = (v) => (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

const ymLabel = (ym) => {
  if (!ym) return '—';
  const [y, m] = ym.split('-').map(Number);
  return `${MONTH_NAMES[m - 1]} de ${y}`;
};
const ymShort = (ym) => {
  if (!ym) return '—';
  const [y, m] = ym.split('-').map(Number);
  return `${MONTH_SHORT[m - 1]}/${String(y).slice(2)}`;
};
const addMonthsYM = (ym, n) => {
  const [y, m] = ym.split('-').map(Number);
  const idx = (m - 1) + n;
  const yy = y + Math.floor(idx / 12);
  const mm = ((idx % 12) + 12) % 12 + 1;
  return `${yy}-${String(mm).padStart(2, '0')}`;
};
const cmpYM = (a, b) => (a === b ? 0 : (a < b ? -1 : 1));
const dateYM = (d) => (d ? d.slice(0, 7) : '');
const fmtDateBR = (d) => {
  if (!d) return '—';
  const [y, m, day] = d.split('-');
  return `${day}/${m}/${y}`;
};

function isActiveInMonth(inicioYM, fimYM, ym) {
  if (!inicioYM) return false;
  if (cmpYM(ym, inicioYM) < 0) return false;
  if (fimYM && cmpYM(ym, fimYM) > 0) return false;
  return true;
}

function gerarParcelas(inicioYM, qtd, valorParcela, valorTotal) {
  const parcelas = [];
  const [y, m] = inicioYM.split('-').map(Number);
  for (let i = 1; i <= qtd; i++) {
    const idx = (m - 1) + (i - 1);
    const yy = y + Math.floor(idx / 12);
    const mm = (idx % 12) + 1;
    const competencia = `${yy}-${String(mm).padStart(2, '0')}`;
    let valor = valorParcela;
    if (i === qtd && valorTotal) {
      valor = +(valorTotal - valorParcela * (qtd - 1)).toFixed(2);
    }
    parcelas.push({ id: uid(), numero: i, competencia, valor, paga: false });
  }
  return parcelas;
}

/* ============================================================
   STORAGE HOOK
   - Sempre grava em localStorage (cache instantâneo + modo offline).
   - Se a pessoa estiver logada com Google (window.FinancasCloud),
     também sincroniza com o Firestore, e escuta atualizações vindas
     de outros aparelhos em tempo real.
   ============================================================ */
function loadLocalData() {
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    return { ...defaultData(), ...parsed, categorias: (parsed.categorias && parsed.categorias.length) ? parsed.categorias : defaultData().categorias };
  } catch (e) {
    return null;
  }
}

function useFinanceData() {
  const [data, setData] = useState(() => loadLocalData() || defaultData());
  const [status, setStatus] = useState('ready'); // ready | saving | saved | error
  const [user, setUser] = useState(() => (window.FinancasCloud ? window.FinancasCloud.getUser() : null));
  const cloudConfigured = !!(window.FinancasCloud && window.FinancasCloud.configured);
  const saveTimer = useRef(null);
  const flashTimer = useRef(null);
  const unsubRef = useRef(null);
  const userRef = useRef(user);
  userRef.current = user;

  // Escuta mudanças de login (evento disparado pelo bloco Firebase no <head>)
  useEffect(() => {
    const handler = (e) => setUser(e.detail.user);
    window.addEventListener('financas-auth-changed', handler);
    return () => window.removeEventListener('financas-auth-changed', handler);
  }, []);

  // Quando loga: busca o que já existe na nuvem (ou envia o local pela primeira vez)
  // e passa a escutar atualizações em tempo real vindas de outros aparelhos.
  useEffect(() => {
    if (unsubRef.current) { unsubRef.current(); unsubRef.current = null; }
    if (!user || !window.FinancasCloud) return;
    let cancelled = false;

    (async () => {
      setStatus('saving');
      try {
        const cloudDoc = await window.FinancasCloud.loadDoc(user.uid);
        if (cancelled) return;
        if (cloudDoc && cloudDoc.data) {
          const parsed = JSON.parse(cloudDoc.data);
          const merged = { ...defaultData(), ...parsed, categorias: (parsed.categorias && parsed.categorias.length) ? parsed.categorias : defaultData().categorias };
          setData(merged);
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
        } else {
          await window.FinancasCloud.saveDoc(user.uid, loadLocalData() || defaultData());
        }
        setStatus('saved');
        flashTimer.current = setTimeout(() => setStatus('ready'), 1200);
      } catch (e) {
        setStatus('error');
      }
    })();

    unsubRef.current = window.FinancasCloud.subscribe(user.uid, (cloudDoc) => {
      try {
        const parsed = JSON.parse(cloudDoc.data);
        const merged = { ...defaultData(), ...parsed, categorias: (parsed.categorias && parsed.categorias.length) ? parsed.categorias : defaultData().categorias };
        setData(merged);
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
      } catch (e) { /* ignore malformed snapshot */ }
    });

    return () => { cancelled = true; };
  }, [user]);

  const writeNow = (next) => {
    try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); } catch (e) { /* ignore */ }
    if (userRef.current && window.FinancasCloud) {
      window.FinancasCloud.saveDoc(userRef.current.uid, next)
        .then(() => { setStatus('saved'); flashTimer.current = setTimeout(() => setStatus('ready'), 1200); })
        .catch(() => setStatus('error'));
    } else {
      setStatus('saved');
      flashTimer.current = setTimeout(() => setStatus('ready'), 1200);
    }
  };

  const persist = useCallback((next) => {
    setData(next);
    if (saveTimer.current) clearTimeout(saveTimer.current);
    if (flashTimer.current) clearTimeout(flashTimer.current);
    setStatus('saving');
    saveTimer.current = setTimeout(() => writeNow(next), 300);
  }, []);

  const replaceAll = useCallback((next) => {
    setData(next);
    setStatus('saving');
    setTimeout(() => writeNow(next), 100);
  }, []);

  const signIn = useCallback(() => { if (window.FinancasCloud) window.FinancasCloud.signIn(); }, []);
  const signOutUser = useCallback(() => { if (window.FinancasCloud) window.FinancasCloud.signOutUser(); }, []);

  return { data, status, persist, replaceAll, user, cloudConfigured, signIn, signOutUser };
}

function DividaForm({ initial, categorias, cartoes, onSave, onCancel }) {
  const [v, setV] = useState(() => initial || {
    nome: '', valorTotal: '', valorParcela: '', qtdParcelas: '', dataInicio: todayYM(),
    categoria: categorias.find((c) => c.nome === 'Dívidas')?.nome || categorias[0]?.nome || '',
    formaPagamento: FORMAS_PAGAMENTO[1], cartaoId: '', observacao: '',
  });
  const [manualParcela, setManualParcela] = useState(!!initial);
  const [err, setErr] = useState({});

  const recompute = (next) => {
    if (!manualParcela && next.valorTotal && next.qtdParcelas) {
      const auto = Number(next.valorTotal) / Number(next.qtdParcelas);
      if (!isNaN(auto)) next.valorParcela = +auto.toFixed(2);
    }
    return next;
  };
  const set = (k, val) => setV((s) => recompute({ ...s, [k]: val }));
  const setParcela = (val) => { setManualParcela(true); setV((s) => ({ ...s, valorParcela: val })); };

  const fimPrevisto = useMemo(() => {
    if (!v.dataInicio || !v.qtdParcelas) return '';
    return addMonthsYM(v.dataInicio, Number(v.qtdParcelas) - 1);
  }, [v.dataInicio, v.qtdParcelas]);

  const submit = () => {
    const e = {};
    if (!v.nome.trim()) e.nome = 'Informe o nome da dívida';
    if (!v.valorTotal || Number(v.valorTotal) <= 0) e.valorTotal = 'Informe o valor total';
    const qtdN = Number(v.qtdParcelas);
    if (!v.qtdParcelas || qtdN < 1 || !Number.isInteger(qtdN)) e.qtdParcelas = 'Informe um número de parcelas válido';
    if (!v.valorParcela || Number(v.valorParcela) <= 0) e.valorParcela = 'Informe o valor da parcela';
    if (!v.dataInicio) e.dataInicio = 'Informe a data de início';
    if (!v.categoria) e.categoria = 'Selecione uma categoria';
    if (!v.formaPagamento) e.formaPagamento = 'Selecione a forma de pagamento';
    if (v.formaPagamento === 'Cartão de crédito' && !v.cartaoId) e.cartaoId = 'Selecione o cartão';
    if (Object.keys(e).length) { setErr(e); return; }

    const qtd = qtdN;
    const valorParcela = Number(v.valorParcela);
    const valorTotal = Number(v.valorTotal);
    const precisaRegerar = !initial || initial.qtdParcelas !== qtd || initial.dataInicio !== v.dataInicio
      || Number(initial.valorParcela) !== valorParcela || Number(initial.valorTotal) !== valorTotal;
    const parcelas = precisaRegerar ? gerarParcelas(v.dataInicio, qtd, valorParcela, valorTotal) : initial.parcelas;
    onSave({ ...v, valorTotal, valorParcela, qtdParcelas: qtd, parcelas, id: v.id || uid() });
  };

  return (
    <>
      <Field label="Nome / descrição da dívida" error={err.nome}>
        <input className="input" value={v.nome} onChange={(e) => set('nome', e.target.value)} placeholder="Ex.: Financiamento notebook" />
      </Field>
      <div className="row2">
        <Field label="Valor total (R$)" error={err.valorTotal}>
          <input className="input mono" type="number" min="0" step="0.01" value={v.valorTotal} onChange={(e) => set('valorTotal', e.target.value)} />
        </Field>
        <Field label="Qtd. de parcelas" error={err.qtdParcelas}>
          <input className="input mono" type="number" min="1" step="1" value={v.qtdParcelas} onChange={(e) => set('qtdParcelas', e.target.value)} />
        </Field>
      </div>
      <div className="row2">
        <Field label="Valor da parcela (R$)" error={err.valorParcela} hint="Calculado automaticamente; você pode ajustar">
          <input className="input mono" type="number" min="0" step="0.01" value={v.valorParcela} onChange={(e) => setParcela(e.target.value)} />
        </Field>
        <Field label="Início (1ª parcela)" error={err.dataInicio}>
          <input className="input" type="month" value={v.dataInicio} onChange={(e) => set('dataInicio', e.target.value)} />
        </Field>
      </div>
      {fimPrevisto && <p className="field-hint" style={{ marginTop: -8, marginBottom: 12 }}>Término previsto: <strong>{ymLabel(fimPrevisto)}</strong></p>}
      <Field label="Categoria" error={err.categoria}>
        <SelectField value={v.categoria} onChange={(val) => set('categoria', val)} options={categorias.map((c) => c.nome)} placeholder="Selecione" />
      </Field>
      <div className="row2">
        <Field label="Forma de pagamento" error={err.formaPagamento}>
          <SelectField value={v.formaPagamento} onChange={(val) => set('formaPagamento', val)} options={FORMAS_PAGAMENTO} />
        </Field>
        <CartaoSelectBlock formaPagamento={v.formaPagamento} cartaoId={v.cartaoId} setCartaoId={(val) => set('cartaoId', val)} cartoes={cartoes} error={err.cartaoId} />
      </div>
      <Field label="Observação">
        <textarea className="textarea" rows={2} value={v.observacao} onChange={(e) => set('observacao', e.target.value)} />
      </Field>
      <ModalFooter onCancel={onCancel} onSave={submit} />
    </>
  );

        </Field>

      <ModalFooter onCancel={onCancel} onSave={submit} saveLabel="Salvar atualização" />
    </>
  );
}

/* ============================================================
   HELPERS DE CÁLCULO (usam o mês de referência = competência)
   ============================================================ */
function sumBy(arr, key = 'valor') { return arr.reduce((s, x) => s + (Number(x[key]) || 0), 0); }
function calcGastosFixosMes(data, ym) { return data.gastosFixos.filter((g) => isActiveInMonth(g.dataInicio, g.dataFim, ym)); }
function calcAssinaturasMes(data, ym) { return data.assinaturas.filter((a) => isActiveInMonth(a.dataInicio, a.dataFim, ym)); }
function calcParcelasMes(data, ym) {
  return data.dividas.flatMap((d) => d.parcelas.filter((p) => p.competencia === ym)
    .map((p) => ({ ...p, dividaId: d.id, dividaNome: d.nome, categoria: d.categoria })));
}
function calcReceitasMes(data, ym) { return data.receitas.filter((r) => r.competencia === ym); }
function calcGastosVariaveisMes(data, ym) { return data.gastosVariaveis.filter((g) => g.competencia === ym); }

function investimentoAsOf(inv, ym) {
  const hist = [...inv.historico].sort((a, b) => (a.data < b.data ? -1 : 1));
  let val = null;
  hist.forEach((h) => { if (dateYM(h.data) <= ym) val = h.valor; });
  if (val === null && dateYM(inv.dataInvestimento) <= ym) val = inv.valorInicial;
  return val;
}

function calcFatura(data, cartaoId, ym) {
  const itens = [];
  data.gastosVariaveis.filter((g) => g.formaPagamento === 'Cartão de crédito' && g.cartaoId === cartaoId && g.competencia === ym)
    .forEach((g) => itens.push({ tipo: 'Gasto variável', desc: g.descricao, valor: g.valor }));
  data.gastosFixos.filter((g) => g.formaPagamento === 'Cartão de crédito' && g.cartaoId === cartaoId && isActiveInMonth(g.dataInicio, g.dataFim, ym))
    .forEach((g) => itens.push({ tipo: 'Gasto fixo', desc: g.descricao, valor: g.valor }));
  data.assinaturas.filter((a) => a.formaPagamento === 'Cartão de crédito' && a.cartaoId === cartaoId && isActiveInMonth(a.dataInicio, a.dataFim, ym))
    .forEach((a) => itens.push({ tipo: 'Assinatura', desc: a.nome, valor: a.valor }));
  data.dividas.filter((d) => d.formaPagamento === 'Cartão de crédito' && d.cartaoId === cartaoId)
    .forEach((d) => d.parcelas.filter((p) => p.competencia === ym)
      .forEach((p) => itens.push({ tipo: 'Dívida', desc: `${d.nome} (parcela ${p.numero}/${d.qtdParcelas})`, valor: p.valor })));
  return { itens, total: sumBy(itens) };
}

function DeleteButton({ onDelete, label = 'Excluir?' }) {
  const [confirming, setConfirming] = useState(false);
  if (confirming) return <ConfirmInline text={label} onConfirm={onDelete} onCancel={() => setConfirming(false)} />;
  return <button type="button" className="icon-btn icon-btn-danger" onClick={() => setConfirming(true)}><Trash2 size={15} /></button>;
}

/* ============================================================
   DASHBOARD
   ============================================================ */
function DashboardView({ data, ym, setYm }) {
  const receitasMes = calcReceitasMes(data, ym);
  const fixosMes = calcGastosFixosMes(data, ym);
  const variaveisMes = calcGastosVariaveisMes(data, ym);
  const assinaturasMes = calcAssinaturasMes(data, ym);
  const parcelasMes = calcParcelasMes(data, ym);

  const totalReceitas = sumBy(receitasMes);
  const totalFixos = sumBy(fixosMes);
  const totalVariaveis = sumBy(variaveisMes);
  const totalAssinaturas = sumBy(assinaturasMes);
  const totalDividas = sumBy(parcelasMes);
  const totalGastos = totalFixos + totalVariaveis + totalAssinaturas + totalDividas;
  const saldo = totalReceitas - totalGastos;
  const totalFaturas = sumBy(data.cartoes.map((c) => ({ valor: calcFatura(data, c.id, ym).total })));
  const totalInvestido = sumBy(data.investimentos.map((inv) => ({ valor: investimentoAsOf(inv, ym) || 0 })));

  const catMap = {};
  [...fixosMes, ...variaveisMes, ...assinaturasMes, ...parcelasMes].forEach((item) => {
    const cat = item.categoria || 'Outros';
    catMap[cat] = (catMap[cat] || 0) + Number(item.valor || 0);
  });
  const catEntries = Object.entries(catMap).sort((a, b) => b[1] - a[1]);

  const trend = [];
  for (let i = 5; i >= 0; i--) {
    const m = addMonthsYM(ym, -i);
    const r = sumBy(calcReceitasMes(data, m));
    const g = sumBy(calcGastosFixosMes(data, m)) + sumBy(calcGastosVariaveisMes(data, m))
      + sumBy(calcAssinaturasMes(data, m)) + sumBy(calcParcelasMes(data, m));
    trend.push({ mes: ymShort(m), saldo: +(r - g).toFixed(2) });
  }

  return (
    <div className="view">
      <SectionHeader title="Visão geral" subtitle="Seu resumo financeiro do mês" />
      <MonthNav ym={ym} setYm={setYm} />
      <div className="stat-grid">
        <StatCard label="Receitas" value={brl(totalReceitas)} tone="positive" />
        <StatCard label="Gastos totais" value={brl(totalGastos)} tone="negative" />
        <StatCard label="Saldo do mês" value={brl(saldo)} tone={saldo >= 0 ? 'positive' : 'negative'} />
        <StatCard label="Total investido" value={brl(totalInvestido)} tone="gold" />
      </div>
      <div className="stat-grid stat-grid-sm">
        <StatCard label="Fixos" value={brl(totalFixos)} />
        <StatCard label="Variáveis" value={brl(totalVariaveis)} />
        <StatCard label="Assinaturas" value={brl(totalAssinaturas)} />
        <StatCard label="Dívidas" value={brl(totalDividas)} />
        <StatCard label="Faturas de cartão" value={brl(totalFaturas)} sub="incluso no total" />
      </div>

      <div className="panel">
        <h3 className="panel-title"><TrendingUp size={16} /> Evolução (últimos 6 meses)</h3>
        <MiniAreaChart data={trend} xKey="mes" yKey="saldo" color="#1F6F54" height={150} />
      </div>

      <div className="panel">
        <h3 className="panel-title"><Tag size={16} /> Gastos por categoria</h3>
        {catEntries.length === 0 ? (
          <EmptyState icon={Tag} title="Nada por aqui" text="Nenhum gasto lançado neste mês." />
        ) : (
          <div className="bar-list">
            {catEntries.map(([cat, val], i) => <BarRow key={cat} label={cat} value={val} total={totalGastos || 1} color={PALETTE[i % PALETTE.length]} />)}
          </div>
        )}
      </div>
    </div>
  );
}

function AssinaturasView({ data, ym, setYm, cartoes, onAdd, onEdit, onDelete }) {
  const [expanded, setExpanded] = useState(null);
  const list = [...data.assinaturas].sort((a, b) => (a.dataInicio < b.dataInicio ? -1 : 1));
  const ativas = list.filter((a) => isActiveInMonth(a.dataInicio, a.dataFim, ym));
  const totalAtivas = sumBy(ativas);
  const cartaoNome = (id) => cartoes.find((c) => c.id === id)?.nome || '—';

  const historicoDe = (a) => {
    const fimHist = a.dataFim && cmpYM(a.dataFim, todayYM()) < 0 ? a.dataFim : todayYM();
    const meses = [];
    let m = a.dataInicio;
    let guard = 0;
    while (cmpYM(m, fimHist) <= 0 && guard < 240) { meses.push(m); m = addMonthsYM(m, 1); guard++; }
    return meses.reverse();
  };

  return (
    <div className="view">
      <SectionHeader title="Assinaturas" action={<button type="button" className="btn btn-primary btn-sm" onClick={onAdd}><Plus size={15} /> Nova</button>} />

                    <div className="entry-top"><strong>{a.nome}</strong><span className="mono negative-text">{brl(a.valor)}</span></div>
                    <div className="entry-meta">

                {isOpen && (

      <SectionHeader title="Investimentos" subtitle="Acompanhe a evolução mês a mês" action={<button type="button" className="btn btn-primary btn-sm" onClick={onAdd}><Plus size={15} /> Novo</button>} />
      {list.length === 0 ? (
        <EmptyState icon={PiggyBank} title="Nenhum investimento" text="Cadastre seus investimentos e acompanhe a evolução." />
      ) : (
        <div className="card-list">
          {list.map((inv) => {
            const hist = [...inv.historico].sort((a, b) => (a.data < b.data ? -1 : 1));
            const atual = hist.length ? hist[hist.length - 1].valor : inv.valorInicial;
            const rent = inv.valorInicial > 0 ? ((atual - inv.valorInicial) / inv.valorInicial) * 100 : 0;
            const isOpen = expanded === inv.id;
            const chartData = hist.map((h) => ({ data: ymShort(dateYM(h.data)), valor: h.valor }));
            return (
              <div className="entry-card entry-card-click" key={inv.id}>
                <div className="entry-clickzone" onClick={() => setExpanded(isOpen ? null : inv.id)}>
                  <IconCircle tone="gold"><PiggyBank size={16} /></IconCircle>
                  <div className="entry-main">
                    <div className="entry-top"><strong>{inv.nome}</strong><span className="mono">{brl(atual)}</span></div>
                    <div className="entry-meta">
                      <span>{inv.instituicao || 'Sem instituição'}{inv.tipo ? ` · ${inv.tipo}` : ''}</span>
                      <StatusBadge tone={rent >= 0 ? 'default' : 'negative'}>{rent >= 0 ? '+' : ''}{rent.toFixed(2)}%</StatusBadge>
                    </div>
                  </div>
                  <ChevronDown size={16} className={'chev' + (isOpen ? ' chev-open' : '')} />
                </div>
                {isOpen && (
                  <div className="entry-expand">
                    <div className="entry-meta" style={{ marginBottom: 8 }}>
                      <span>Investido: {brl(inv.valorInicial)} em {fmtDateBR(inv.dataInvestimento)}</span>
                    </div>
                    {inv.observacao && <p className="entry-note">{inv.observacao}</p>}
                    {chartData.length > 1 && (
                      <div style={{ marginTop: 8 }}>
                        <MiniAreaChart data={chartData} xKey="data" yKey="valor" color="#B08D2B" height={130} />
                      </div>
                    )}
                    <p className="entry-note" style={{ fontWeight: 600, marginTop: 8 }}>Histórico</p>
                    <div className="mini-history">
                      {hist.slice().reverse().map((h) => (
                        <div key={h.id} className="mini-history-row"><span>{fmtDateBR(h.data)}</span><span className="mono">{brl(h.valor)}</span></div>
                      ))}
                    </div>
                    <div className="item-actions" style={{ marginTop: 10, justifyContent: 'space-between' }}>
                      <button type="button" className="btn btn-ghost btn-sm" onClick={() => onUpdateValue(inv.id)}><TrendingUp size={14} /> Atualizar valor</button>
                      <div style={{ display: 'flex', gap: 6 }}>
                        <button type="button" className="icon-btn" onClick={() => onEdit('investimento', inv.id)}><Pencil size={15} /></button>
                        <DeleteButton onDelete={() => onDelete('investimentos', inv.id)} />
                      </div>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   CATEGORIAS
   ============================================================ */
function CategoriasView({ data, onAdd, onDelete }) {
  const usageCount = (nome) => {
    let n = 0;
    n += data.receitas.filter((r) => r.categoria === nome).length;
    n += data.gastosFixos.filter((g) => g.categoria === nome).length;
    n += data.gastosVariaveis.filter((g) => g.categoria === nome).length;
    n += data.assinaturas.filter((a) => a.categoria === nome).length;
    n += data.dividas.filter((d) => d.categoria === nome).length;
    return n;
  };
  const [novo, setNovo] = useState('');
  const [warn, setWarn] = useState(null);
  const add = () => {
    const nome = novo.trim();
    if (!nome) return;
    if (data.categorias.some((c) => c.nome.toLowerCase() === nome.toLowerCase())) { setWarn('Essa categoria já existe.'); return; }
    onAdd(nome); setNovo(''); setWarn(null);
  };
  const tryDelete = (cat) => {
    const n = usageCount(cat.nome);
    if (n > 0) { setWarn(`"${cat.nome}" está em uso em ${n} lançamento(s). Altere-os antes de excluir.`); return; }
    onDelete(cat.id);
  };
  return (
    <div className="view">
      <SectionHeader title="Categorias" subtitle="Usadas em receitas, gastos, dívidas e assinaturas" />
      <div className="new-cat-row">
        <input className="input" value={novo} onChange={(e) => setNovo(e.target.value)} placeholder="Nova categoria" onKeyDown={(e) => e.key === 'Enter' && add()} />
        <button type="button" className="btn btn-primary btn-sm" onClick={add}><Plus size={15} /></button>
      </div>
      {warn && <p className="field-error" style={{ marginBottom: 10 }}><AlertCircle size={12} /> {warn}</p>}
      <div className="chip-list">
        {data.categorias.map((c) => (
          <div key={c.id} className="chip">
            <span>{c.nome}</span>
            <button type="button" className="chip-x" onClick={() => tryDelete(c)}><X size={12} /></button>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ============================================================
   CONFIGURAÇÕES / SINCRONIZAÇÃO
   ============================================================ */
function ConfigView({ data, status, replaceAll, user, cloudConfigured, signIn, signOutUser }) {
  const fileRef = useRef(null);
  const [confirmReset, setConfirmReset] = useState(false);

  const exportar = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `minhas-financas-backup-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const importar = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (window.confirm('Isso vai substituir todos os dados atuais pelos dados do arquivo. Continuar?')) {
          replaceAll({ ...defaultData(), ...parsed });
        }
      } catch (err) { window.alert('Arquivo inválido.'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  const counts = {
    'Receitas': data.receitas.length,
    'Gastos fixos': data.gastosFixos.length,
    'Gastos variáveis': data.gastosVariaveis.length,
    'Assinaturas': data.assinaturas.length,
    'Dívidas': data.dividas.length,
    'Cartões': data.cartoes.length,
    'Investimentos': data.investimentos.length,
    'Categorias': data.categorias.length,
  };

  return (
    <div className="view">
      <SectionHeader title="Configurações & Sincronização" />

      {!cloudConfigured && (
        <div className="panel panel-danger">
          <h3 className="panel-title"><ShieldAlert size={16} /> Sincronização com Google ainda não configurada</h3>
          <p className="entry-note">
            Este arquivo já vem pronto para sincronizar entre aparelhos usando sua conta do Google,
            mas falta colar as chaves do seu projeto Firebase no início do arquivo (procure por
            <strong> FIREBASE_CONFIG</strong>). Sem isso, os dados ficam salvos apenas
            <strong> neste navegador, neste aparelho</strong> — use Exportar/Importar backup abaixo
            para levar os dados de um aparelho para o outro enquanto isso.
          </p>
        </div>
      )}

      {cloudConfigured && !user && (
        <div className="panel">
          <h3 className="panel-title"><LogIn size={16} /> Entrar com Google para sincronizar</h3>
          <p className="entry-note">
            Você ainda não está logado. Sem login, os dados ficam só neste navegador/aparelho.
            Entre com sua conta Google para sincronizar automaticamente entre o celular e o computador.
          </p>
          <button type="button" className="btn btn-primary btn-sm" style={{ marginTop: 10 }} onClick={signIn}>
            <LogIn size={14} /> Entrar com Google
          </button>
        </div>
      )}

      {cloudConfigured && user && (
        <div className="panel">
          <h3 className="panel-title"><UserCircle size={16} /> Sincronizado com o Google</h3>
          <p className="entry-note">
            Logado como <strong>{user.email}</strong>. Os dados são salvos automaticamente na nuvem
            e atualizados em qualquer aparelho onde você entrar com essa mesma conta — sem precisar
            exportar/importar nada.
          </p>
          <button type="button" className="btn btn-ghost btn-sm" style={{ marginTop: 10 }} onClick={signOutUser}>
            <LogOut size={14} /> Sair desta conta
          </button>
        </div>
      )}

      <div className="panel">
        <h3 className="panel-title"><Check size={16} /> Status do salvamento</h3>
        <div className="status-line">
          <span>Status atual:</span>
          {status === 'saving' && <StatusBadge tone="default"><Loader2 size={12} className="spin" /> Salvando…</StatusBadge>}
          {status === 'saved' && <StatusBadge tone="positive"><Check size={12} /> Salvo{user ? ' na nuvem' : ' neste aparelho'}</StatusBadge>}
          {status === 'ready' && <StatusBadge tone="positive"><Check size={12} /> Tudo salvo{user ? ' na nuvem' : ' neste aparelho'}</StatusBadge>}
          {status === 'error' && <StatusBadge tone="negative"><AlertCircle size={12} /> Erro ao salvar — tente novamente</StatusBadge>}
        </div>
      </div>

      <div className="panel">
        <h3 className="panel-title"><ListChecks size={16} /> Resumo dos dados salvos</h3>
        <div className="mini-history">
          {Object.entries(counts).map(([k, v]) => (
            <div key={k} className="mini-history-row"><span>{k}</span><span className="mono">{v}</span></div>
          ))}
        </div>
      </div>

      <div className="panel">
        <h3 className="panel-title"><Download size={16} /> Backup manual</h3>
        <p className="entry-note">Exporte um arquivo com tudo o que está salvo agora — guarde-o antes de fazer mudanças grandes. Você pode importar esse arquivo depois para restaurar os dados.</p>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginTop: 10 }}>
          <button type="button" className="btn btn-secondary btn-sm" onClick={exportar}><Download size={14} /> Exportar backup</button>
          <button type="button" className="btn btn-secondary btn-sm" onClick={() => fileRef.current && fileRef.current.click()}><Upload size={14} /> Importar backup</button>
          <input type="file" accept="application/json" ref={fileRef} style={{ display: 'none' }} onChange={importar} />
        </div>
      </div>

      <div className="panel panel-danger">
        <h3 className="panel-title"><ShieldAlert size={16} /> Zona de risco</h3>
        <p className="entry-note">Apaga todos os lançamentos, cartões, dívidas e investimentos. Essa ação não pode ser desfeita — exporte um backup antes.</p>
        {!confirmReset ? (
          <button type="button" className="btn btn-danger btn-sm" style={{ marginTop: 10 }} onClick={() => setConfirmReset(true)}>Apagar todos os dados</button>
        ) : (
          <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
            <button type="button" className="btn btn-ghost btn-sm" onClick={() => setConfirmReset(false)}>Cancelar</button>
            <button type="button" className="btn btn-danger btn-sm" onClick={() => { replaceAll(defaultData()); setConfirmReset(false); }}>Confirmar exclusão total</button>
          </div>
        )}
      </div>
    </div>
  );
}

      .field-label { font-size: 12px; font-weight: 600; color: var(--ink-soft); }
      .field-hint { font-size: 11px; color: var(--ink-faint); }
      .field-error { font-size: 11px; color: var(--negative); display: flex; align-items: center; gap: 4px; }
      .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .input, .select, .textarea {
        width: 100%; border: 1px solid var(--border); border-radius: 9px; padding: 10px 11px;
        font-size: 14px; font-family: inherit; color: var(--ink); background: var(--surface);
      }
      .input:focus, .select:focus, .textarea:focus { outline: 2px solid var(--brand); outline-offset: 1px; border-color: var(--brand); }
      .textarea { resize: vertical; min-height: 54px; }

      .btn { display: inline-flex; align-items: center; gap: 6px; justify-content: center; padding: 10px 16px; border-radius: 10px; font-size: 13.5px; font-weight: 600; border: 1px solid transparent; cursor: pointer; }
      .btn-sm { padding: 7px 12px; font-size: 12.5px; }
      .btn-primary { background: var(--ink); color: #fff; }
      .btn-primary:hover { background: #0F151D; }
      .btn-secondary { background: var(--surface); border-color: var(--border); color: var(--ink); }
      .btn-ghost { background: transparent; border-color: var(--border); color: var(--ink-soft); }
      .btn-danger { background: var(--negative); color: #fff; }

      .modal-overlay { position: fixed; inset: 0; background: rgba(28,36,48,0.42); display: flex; align-items: flex-end; justify-content: center; z-index: 100; }
      .modal-sheet, .quick-sheet { background: var(--paper); width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 4px 0 0; animation: slideUp .18s ease-out; }
      .modal-wide { max-width: 640px; }
      @keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      .modal-head { display: flex; align-items: flex-start; justify-content: space-between; padding: 18px 18px 10px; position: sticky; top: 0; background: var(--paper); }
      .modal-head h3 { font-family: 'Source Serif 4', Georgia, serif; font-size: 19px; margin: 0; font-weight: 600; }
      .modal-subtitle { margin: 3px 0 0; font-size: 12.5px; color: var(--ink-soft); }
      .modal-body { padding: 4px 18px 12px; }
      .modal-footer { display: flex; gap: 10px; justify-content: flex-end; padding: 6px 0 16px; position: sticky; bottom: 0; background: var(--paper); }

      .quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 6px 18px 22px; }
      .quick-opt { display: flex; flex-direction: column; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 6px; cursor: pointer; font-size: 12px; color: var(--ink); font-weight: 500; }
      .quick-opt:hover { border-color: var(--ink); }

      .fab { position: fixed; right: 20px; bottom: 24px; width: 54px; height: 54px; border-radius: 50%; background: var(--brand); color: #fff; border: none; box-shadow: 0 8px 20px rgba(31,111,84,0.35); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 40; }
      .fab:hover { background: var(--brand-dark); }

      .loading-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 100vh; color: var(--ink-soft); font-size: 13px; }
      .chart-empty { font-size: 12.5px; color: var(--ink-faint); padding: 20px 0; text-align: center; }
      .chart-labels { display: flex; justify-content: space-between; margin-top: 2px; font-size: 10px; color: var(--ink-faint); }
      .spin { animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      @media (min-width: 720px) {
        .app-shell { max-width: 880px; padding-top: 8px; }
        .stat-grid { grid-template-columns: repeat(4, 1fr); }
        .stat-grid-sm { grid-template-columns: repeat(5, 1fr); }
        .tabbar { overflow-x: visible; flex-wrap: wrap; }
        .quick-grid { grid-template-columns: repeat(6, 1fr); }
        .modal-overlay { align-items: center; }
        .modal-sheet, .quick-sheet { border-radius: 18px; max-height: 84vh; }
      }
    `}</style>
  );
}

/* ============================================================
   APP
   ============================================================ */
const TABS = [
  { key: 'dashboard', label: 'Visão geral', icon: LayoutDashboard },
  { key: 'receitas', label: 'Receitas', icon: Wallet },
  { key: 'gastos', label: 'Gastos', icon: Receipt },
  { key: 'assinaturas', label: 'Assinaturas', icon: Repeat },
  { key: 'dividas', label: 'Dívidas', icon: Landmark },
  { key: 'cartoes', label: 'Cartões', icon: CreditCard },
  { key: 'investimentos', label: 'Investimentos', icon: PiggyBank },
  { key: 'categorias', label: 'Categorias', icon: Tag },
  { key: 'config', label: 'Config.', icon: Settings2 },
];

const QUICK_OPTIONS = [
  { type: 'receita', label: 'Receita', icon: ArrowUpRight, tone: 'positive' },
  { type: 'gastoFixo', label: 'Gasto fixo', icon: Receipt, tone: 'negative' },
  { type: 'gastoVariavel', label: 'Gasto variável', icon: ArrowDownRight, tone: 'negative' },
  { type: 'assinatura', label: 'Assinatura', icon: Repeat, tone: 'negative' },
  { type: 'divida', label: 'Dívida', icon: Landmark, tone: 'negative' },
  { type: 'investimento', label: 'Investimento', icon: PiggyBank, tone: 'gold' },
];

function App() {
  const { data, status, persist, replaceAll, user, cloudConfigured, signIn, signOutUser } = useFinanceData();
  const [tab, setTab] = useState('dashboard');
  const [ym, setYm] = useState(todayYM());
  const [gastoSubTab, setGastoSubTab] = useState('fixos');
  const [modal, setModal] = useState(null);
  const [quickOpen, setQuickOpen] = useState(false);

  const openModal = (type, id = null) => setModal({ type, id });
  const closeModal = () => setModal(null);

  if (!data) {
    return (
      <div className="financas-root">
        <GlobalStyle />
        <LoadingScreen />
      </div>
    );
  }

  const update = (patch) => persist({ ...data, ...patch });
  const addItem = (key, item) => update({ [key]: [...data[key], item] });
  const editItem = (key, id, patch) => update({ [key]: data[key].map((it) => (it.id === id ? { ...it, ...patch } : it)) });
  const removeItem = (key, id) => update({ [key]: data[key].filter((it) => it.id !== id) });
  const addCategoria = (nome) => addItem('categorias', { id: uid(), nome });
  const togglePagaParcela = (dividaId, parcelaId) => {
    update({
      dividas: data.dividas.map((d) => (d.id !== dividaId ? d : {
        ...d, parcelas: d.parcelas.map((p) => (p.id === parcelaId ? { ...p, paga: !p.paga } : p)),
      })),
    });
  };

  const renderModal = () => {
    if (!modal) return null;
    const { type: t, id } = modal;
    if (t === 'receita') {
      const initial = id ? data.receitas.find((x) => x.id === id) : null;
      return (
        <Modal title={initial ? 'Editar receita' : 'Nova receita'} onClose={closeModal}>
          <ReceitaForm initial={initial} categorias={data.categorias} onCancel={closeModal}
            onSave={(item) => { initial ? editItem('receitas', item.id, item) : addItem('receitas', item); closeModal(); }} />
        </Modal>
      );
    }
    if (t === 'gastoFixo') {
      const initial = id ? data.gastosFixos.find((x) => x.id === id) : null;
      return (
        <Modal title={initial ? 'Editar gasto fixo' : 'Novo gasto fixo'} onClose={closeModal}>
          <GastoFixoForm initial={initial} categorias={data.categorias} cartoes={data.cartoes} onCancel={closeModal}
            onSave={(item) => { initial ? editItem('gastosFixos', item.id, item) : addItem('gastosFixos', item); closeModal(); }} />
        </Modal>
      );
    }
    if (t === 'gastoVariavel') {
      const initial = id ? data.gastosVariaveis.find((x) => x.id === id) : null;
      return (
        <Modal title={initial ? 'Editar gasto variável' : 'Novo gasto variável'} onClose={closeModal}>
          <GastoVariavelForm initial={initial} categorias={data.categorias} cartoes={data.cartoes} onCancel={closeModal}
            onSave={(item) => { initial ? editItem('gastosVariaveis', item.id, item) : addItem('gastosVariaveis', item); closeModal(); }} />
        </Modal>
      );
    }
    if (t === 'assinatura') {
      const initial = id ? data.assinaturas.find((x) => x.id === id) : null;
      return (
        <Modal title={initial ? 'Editar assinatura' : 'Nova assinatura'} onClose={closeModal}>
          <AssinaturaForm initial={initial} categorias={data.categorias} cartoes={data.cartoes} onCancel={closeModal}
            onSave={(item) => { initial ? editItem('assinaturas', item.id, item) : addItem('assinaturas', item); closeModal(); }} />
        </Modal>
      );
    }
    if (t === 'divida') {
      const initial = id ? data.dividas.find((x) => x.id === id) : null;
      return (
        <Modal title={initial ? 'Editar dívida' : 'Nova dívida'} onClose={closeModal}>
          <DividaForm initial={initial} categorias={data.categorias} cartoes={data.cartoes} onCancel={closeModal}
            onSave={(item) => { initial ? editItem('dividas', item.id, item) : addItem('dividas', item); closeModal(); }} />
        </Modal>
      );
    }
    if (t === 'cartao') {
      const initial = id ? data.cartoes.find((x) => x.id === id) : null;
      return (
        <Modal title={initial ? 'Editar cartão' : 'Novo cartão'} onClose={closeModal}>
          <CartaoForm initial={initial} onCancel={closeModal}
            onSave={(item) => { initial ? editItem('cartoes', item.id, item) : addItem('cartoes', item); closeModal(); }} />
        </Modal>
      );
    }
    if (t === 'investimento') {
      const initial = id ? data.investimentos.find((x) => x.id === id) : null;
      return (
        <Modal title={initial ? 'Editar investimento' : 'Novo investimento'} onClose={closeModal}>
          <InvestimentoForm initial={initial} categorias={data.categorias} onCancel={closeModal}
            onSave={(item) => { initial ? editItem('investimentos', item.id, item) : addItem('investimentos', item); closeModal(); }} />
        </Modal>
      );
    }
    if (t === 'investimentoUpdate') {
      const inv = data.investimentos.find((x) => x.id === id);
      if (!inv) return null;
      return (
        <Modal title={`Atualizar valor · ${inv.nome}`} subtitle="Cada atualização fica salva no histórico — nada é substituído." onClose={closeModal}>
          <InvestimentoUpdateForm onCancel={closeModal}
            onSave={(entry) => { editItem('investimentos', inv.id, { historico: [...inv.historico, entry] }); closeModal(); }} />
        </Modal>
      );
    }
    return null;
  };

  return (
    <div className="financas-root">
      <GlobalStyle />
      <div className="app-shell">
        <header className="topbar">
          <div className="topbar-brand"><Wallet2 size={20} /><span>Minhas Finanças</span></div>
          <div className="topbar-right">
            <div className="topbar-status">
              {status === 'saving' && <span className="status-pill"><Loader2 size={12} className="spin" /> salvando</span>}
              {status === 'saved' && <span className="status-pill status-ok"><Check size={12} /> salvo{user ? ' na nuvem' : ''}</span>}
              {status === 'error' && <span className="status-pill status-err"><AlertCircle size={12} /> erro</span>}
            </div>
            {cloudConfigured && (
              user ? (
                <button type="button" className="account-btn" onClick={signOutUser} title={user.email}>
                  <UserCircle size={16} /><span className="account-btn-label">Sair</span>
                </button>
              ) : (
                <button type="button" className="account-btn account-btn-cta" onClick={signIn}>
                  <LogIn size={15} /><span className="account-btn-label">Entrar com Google</span>
                </button>
              )
            )}
          </div>
        </header>

        <nav className="tabbar">
          {TABS.map((t) => {
            const Icon = t.icon;
            return (
              <button key={t.key} type="button" className={'tab-pill' + (tab === t.key ? ' active' : '')} onClick={() => setTab(t.key)}>
                <Icon size={15} /><span>{t.label}</span>
              </button>
            );
          })}
        </nav>

        <main className="app-main">
          {tab === 'dashboard' && <DashboardView data={data} ym={ym} setYm={setYm} />}
          {tab === 'receitas' && (
            <ReceitasView data={data} ym={ym} setYm={setYm} categorias={data.categorias}
              onAdd={() => openModal('receita')} onEdit={(id) => openModal('receita', id)} onDelete={(id) => removeItem('receitas', id)} />
          )}
          {tab === 'gastos' && (
            <GastosView data={data} ym={ym} setYm={setYm} categorias={data.categorias} cartoes={data.cartoes}
              subTab={gastoSubTab} setSubTab={setGastoSubTab}
              onAdd={(sub) => openModal(sub === 'fixos' ? 'gastoFixo' : 'gastoVariavel')}
              onEdit={(type, id) => openModal(type, id)}
              onDelete={(key, id) => removeItem(key, id)} />
          )}
          {tab === 'assinaturas' && (
            <AssinaturasView data={data} ym={ym} setYm={setYm} cartoes={data.cartoes}
              onAdd={() => openModal('assinatura')} onEdit={(type, id) => openModal(type, id)} onDelete={(key, id) => removeItem(key, id)} />
          )}
          {tab === 'dividas' && (
            <DividasView data={data} ym={ym} setYm={setYm} cartoes={data.cartoes}
              onAdd={() => openModal('divida')} onEdit={(type, id) => openModal(type, id)} onDelete={(key, id) => removeItem(key, id)}
              onTogglePaga={togglePagaParcela} />
          )}
          {tab === 'cartoes' && (
            <CartoesView data={data} ym={ym} setYm={setYm}
              onAdd={() => openModal('cartao')} onEdit={(type, id) => openModal(type, id)} onDelete={(key, id) => removeItem(key, id)} />
          )}
          {tab === 'investimentos' && (
            <InvestimentosView data={data}
              onAdd={() => openModal('investimento')} onEdit={(type, id) => openModal(type, id)} onDelete={(key, id) => removeItem(key, id)}
              onUpdateValue={(id) => openModal('investimentoUpdate', id)} />
          )}
          {tab === 'categorias' && <CategoriasView data={data} onAdd={addCategoria} onDelete={(id) => removeItem('categorias', id)} />}
          {tab === 'config' && <ConfigView data={data} status={status} replaceAll={replaceAll} user={user} cloudConfigured={cloudConfigured} signIn={signIn} signOutUser={signOutUser} />}
        </main>

        <button type="button" className="fab" onClick={() => setQuickOpen(true)} aria-label="Adicionar lançamento"><Plus size={22} /></button>

        {quickOpen && (
          <div className="modal-overlay" onClick={() => setQuickOpen(false)}>
            <div className="quick-sheet" onClick={(e) => e.stopPropagation()}>
              <div className="modal-head">
                <h3>Adicionar lançamento</h3>
                <button type="button" className="icon-btn" onClick={() => setQuickOpen(false)}><X size={18} /></button>
              </div>
              <div className="quick-grid">
                {QUICK_OPTIONS.map((o) => {
                  const Icon = o.icon;
                  return (
                    <button key={o.type} type="button" className="quick-opt" onClick={() => { setQuickOpen(false); openModal(o.type); }}>
                      <IconCircle tone={o.tone}><Icon size={18} /></IconCircle>
                      <span>{o.label}</span>
                    </button>
                  );
                })}
              </div>
            </div>
          </div>
        )}

        {renderModal()}
      </div>
    </div>
  );
}

const rootEl = document.getElementById('root');
ReactDOM.createRoot(rootEl).render(<App />);

</script>

  (function () {
    var code = document.getElementById('app-source').textContent;

    var s = document.createElement('script');
    s.textContent = result.code;

</body>
